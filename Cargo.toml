[package]
name = "calculadora"
version = "1.0.0"
edition = "2021"
description = "Calculadora para Android escrita em Rust: média, dias entre datas, desconto/aumento em % e calculadora padrão."
license = "MIT"
publish = false

[lib]
# cdylib = biblioteca nativa carregada pelo Android; rlib = usada pelo exemplo de PC e pelos testes.
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = "0.4"
log = "0.4"

# No Android: renderização OpenGL ES (glow) + NativeActivity.
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "android-native-activity"] }
android_logger = "0.15"
winit = { version = "0.30", default-features = false, features = ["android-native-activity", "rwh_06"] }

# No PC (Linux/Windows/macOS): mesma interface, para testar sem celular.
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# ---------------------------------------------------------------------------
# Configuração do APK (usada pelo cargo-apk no GitHub Actions)
# ---------------------------------------------------------------------------
[package.metadata.android]
package = "com.fatosdesconstruidosbw.calculadora"
apk_name = "calculadora"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi"]
resources = "res"
strip = "strip"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

[package.metadata.android.application]
label = "Calculadora"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"

[package.metadata.android.application.activity]
orientation = "portrait"
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|keyboard|uiMode|density"
