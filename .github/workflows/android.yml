name: Gerar APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  NDK_VERSION: "27.2.12479018"
  ANDROID_PLATFORM: "34"
  BUILD_TOOLS: "34.0.0"

jobs:
  testes:
    name: Testes dos cálculos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependências do sistema (para compilar a versão de PC)
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - run: cargo test

  apk:
    name: APK Android
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: Instalar SDK/NDK do Android
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-$ANDROID_PLATFORM" "build-tools;$BUILD_TOOLS" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Instalar cargo-apk
        run: cargo install cargo-apk --locked

      - name: Chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "Usando a chave fixa dos secrets do repositório."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            PASS="$KEYSTORE_PASSWORD"
          else
            echo "::warning::Sem secrets ANDROID_KEYSTORE_BASE64/ANDROID_KEYSTORE_PASSWORD: gerando uma chave temporária. Para atualizar o app sem desinstalar, configure a chave fixa (veja o README)."
            PASS="calculadora"
            keytool -genkeypair -keystore "$KS" -storepass "$PASS" -keypass "$PASS" \
              -alias calculadora -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Calculadora, O=fatosdesconstruidosbw, C=BR"
          fi
          echo "CARGO_APK_RELEASE_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: cargo apk build --release --lib

      - name: Copiar APK
        run: |
          mkdir -p dist
          cp target/release/apk/calculadora.apk dist/calculadora.apk
          ls -la dist

      - name: Enviar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-apk
          path: dist/calculadora.apk

      - name: Publicar na release "Última versão"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima-versao --yes --cleanup-tag || true
          gh release create ultima-versao dist/calculadora.apk \
            --title "Calculadora – última versão" \
            --notes "APK gerado automaticamente a partir do commit ${GITHUB_SHA::7}. Baixe o arquivo **calculadora.apk** abaixo pelo celular e instale." \
            --target "$GITHUB_SHA" --latest
